{% extends 'core/base.html' %}{% block title %}Player login · ROOM ARENA{% endblock %}{% block content %}<section class="form-wrap"><p class="eyebrow">WELCOME BACK</p><h1 class="page-title">Player login</h1><p class="muted">Sign in to manage your squad and tournament activity.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" class="panel-form">{% csrf_token %}<label class="field"><span>Username</span><input name="username" autocomplete="username" required></label><label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label><button class="primary" type="submit">Log in</button></form><p class="muted">New player? <a class="text-link" href="{% url 'signup' %}">Create an account</a></p></section>{% endblock %}
